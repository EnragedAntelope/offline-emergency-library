name: Feature request / idea
description: Suggest content, a region, or an improvement
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Content to add, a region, a platform, a workflow improvement, etc.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful for offline / emergency use?
  - type: input
    id: license
    attributes:
      label: Source & license (for content requests)
      description: Where would it come from, and is it free / openly-licensed / public domain?
